<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="snW" x1="30%" y1="15%" x2="80%" y2="95%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#efeaf8"/>
    </linearGradient>
    <linearGradient id="snSole" x1="30%" y1="15%" x2="80%" y2="95%">
      <stop offset="0%" stop-color="#f4f0ff"/>
      <stop offset="100%" stop-color="#d8d0ea"/>
    </linearGradient>
    <linearGradient id="snP" x1="30%" y1="15%" x2="80%" y2="95%">
      <stop offset="0%" stop-color="#ffb3d4"/>
      <stop offset="100%" stop-color="#ff8fc7"/>
    </linearGradient>
    <linearGradient id="snB" x1="30%" y1="15%" x2="80%" y2="95%">
      <stop offset="0%" stop-color="#7ec0ff"/>
      <stop offset="100%" stop-color="#4fa3ff"/>
    </linearGradient>
  </defs>
  <g stroke="#3b2d55" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(2 14) scale(1 1)">
      <!-- sole -->
      <path d="M4 80
               Q 2 96 16 98
               H 54
               Q 68 98 68 86
               Q 68 76 56 76
               H 12
               Q 4 76 4 80 Z" fill="url(#snSole)"/>
      <!-- upper -->
      <path d="M8 78
               Q 6 52 22 42
               Q 40 34 52 44
               Q 62 52 62 68
               V 78
               Q 34 86 8 78 Z" fill="url(#snW)"/>
      <!-- ankle opening -->
      <ellipse cx="50" cy="50" rx="11" ry="9" fill="#fff6e8"/>
      <!-- colored heel cap -->
      <path d="M50 44
               Q 62 46 62 68
               V 80
               H 52
               Q 50 62 50 44 Z" fill="url(#snP)"/>
      <!-- toe bumper, horizontal, not a mouth -->
      <path d="M12 68 H 28" fill="none" stroke-width="4.5"/>
      <!-- parallel lace marks on the instep -->
      <path d="M28 50 H 40" fill="none" stroke-width="3.4"/>
      <path d="M30 58 H 42" fill="none" stroke-width="3.4"/>
      <path d="M32 66 H 44" fill="none" stroke-width="3.4"/>
      <ellipse cx="20" cy="54" rx="6" ry="4.5" fill="#ffffff" fill-opacity=".7" stroke="none"/>
    </g>
    <g transform="translate(126 14) scale(-1 1)">
      <!-- sole -->
      <path d="M4 80
               Q 2 96 16 98
               H 54
               Q 68 98 68 86
               Q 68 76 56 76
               H 12
               Q 4 76 4 80 Z" fill="url(#snSole)"/>
      <!-- upper -->
      <path d="M8 78
               Q 6 52 22 42
               Q 40 34 52 44
               Q 62 52 62 68
               V 78
               Q 34 86 8 78 Z" fill="url(#snW)"/>
      <!-- ankle opening -->
      <ellipse cx="50" cy="50" rx="11" ry="9" fill="#fff6e8"/>
      <!-- colored heel cap -->
      <path d="M50 44
               Q 62 46 62 68
               V 80
               H 52
               Q 50 62 50 44 Z" fill="url(#snB)"/>
      <!-- toe bumper, horizontal, not a mouth -->
      <path d="M12 68 H 28" fill="none" stroke-width="4.5"/>
      <!-- parallel lace marks on the instep -->
      <path d="M28 50 H 40" fill="none" stroke-width="3.4"/>
      <path d="M30 58 H 42" fill="none" stroke-width="3.4"/>
      <path d="M32 66 H 44" fill="none" stroke-width="3.4"/>
      <ellipse cx="20" cy="54" rx="6" ry="4.5" fill="#ffffff" fill-opacity=".7" stroke="none"/>
    </g>
  </g>

</svg>
