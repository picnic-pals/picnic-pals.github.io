<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="mtL" x1="30%" y1="15%" x2="80%" y2="95%">
      <stop offset="0%" stop-color="#ffd0e0"/>
      <stop offset="100%" stop-color="#ff8fc7"/>
    </linearGradient>
    <linearGradient id="mtR" x1="30%" y1="15%" x2="80%" y2="95%">
      <stop offset="0%" stop-color="#ffd0e0"/>
      <stop offset="100%" stop-color="#ff8fc7"/>
    </linearGradient>
    <linearGradient id="mtCuff" x1="30%" y1="15%" x2="80%" y2="95%">
      <stop offset="0%" stop-color="#fff8e8"/>
      <stop offset="100%" stop-color="#f0e0c4"/>
    </linearGradient>
  </defs>
  <g stroke="#3b2d55" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- left mitten, lower -->
    <g transform="translate(4 18) rotate(-12 32 64)">
      <path d="M18 78
               C 10 78 6 62 14 50
               C 8 36 20 24 34 28
               C 44 16 62 24 60 40
               C 72 46 70 66 58 72
               Q 58 88 34 90
               Q 18 90 18 78 Z" fill="url(#mtL)"/>
      <!-- thumb -->
      <path d="M56 52 C 74 46 80 64 64 68" fill="url(#mtL)"/>
      <rect x="16" y="82" width="44" height="20" rx="8" fill="url(#mtCuff)"/>
      <ellipse cx="30" cy="48" rx="8" ry="6" fill="#ffffff" fill-opacity=".45" stroke="none"/>
    </g>
    <!-- right mitten, waving -->
    <g transform="translate(52 -6) rotate(28 32 64)">
      <path d="M18 78
               C 10 78 6 62 14 50
               C 8 36 20 24 34 28
               C 44 16 62 24 60 40
               C 72 46 70 66 58 72
               Q 58 88 34 90
               Q 18 90 18 78 Z" fill="url(#mtR)"/>
      <path d="M56 52 C 74 46 80 64 64 68" fill="url(#mtR)"/>
      <rect x="16" y="82" width="44" height="20" rx="8" fill="url(#mtCuff)"/>
      <ellipse cx="30" cy="48" rx="8" ry="6" fill="#ffffff" fill-opacity=".45" stroke="none"/>
    </g>
  </g>

</svg>
