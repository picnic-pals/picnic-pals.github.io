    <span class="sunny" id="sunny" aria-hidden="true"></span>
    <button class="sayagain" id="sayBtn" aria-label="Say it again">🔊</button>
  </div>
  <div class="rushbar" id="rushBar" aria-hidden="true"><i></i><b>⏱️ Rush hour!</b></div>
  <div class="standrow">
    <div class="cust" id="cust"><div class="bubble" id="bubble"></div><div class="friend" id="friend"></div></div>
    <div class="counter" id="counter">
      <div class="tray" id="tray"></div>
      <div class="bins" id="bins"></div>
      <div class="acts" id="acts"></div>
    </div>
  </div>
