<!DOCTYPE html>
<html lang="en" data-page-title="munch">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:; font-src 'self'; connect-src 'self' blob: data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Picnic Munch · Picnic Pals</title>
<link rel="icon" type="image/svg+xml" href="../../img/icon.svg">
<link rel="apple-touch-icon" href="../../img/icon-192.png">
<link rel="stylesheet" href="../../css/core.css">
<link rel="stylesheet" href="munch.css">
<link rel="stylesheet" href="../../css/storybook.css">
</head>
<body>
<section class="screen on" id="game">
  <div class="top">
    <button class="iconbtn" id="homeBtn" aria-label="Back to the arcade"><svg viewBox="0 0 24 24"><path d="M3.5 11.2 12 4l8.5 7.2" fill="none" stroke="#7a6a99" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10.5V19a1 1 0 0 0 1 1h3.5v-5h3v5H17a1 1 0 0 0 1-1v-8.5" fill="#ffd6e3" stroke="#7a6a99" stroke-width="2.2" stroke-linejoin="round"/></svg></button>
    <div class="rule" id="rule">
      <div class="txt" id="ruleTxt"></div>
      <button class="speak" id="speakBtn" aria-label="Hear the rule again (R)"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#5aa9f0"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="#5aa9f0" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg></button>
    </div>
    <button class="iconbtn music" id="musicBtn" aria-label="Music is on (M)"><svg viewBox="0 0 24 24"><path d="M9 17.5V6.2l10-2.2v11.3" fill="none" stroke="#7a6a99" stroke-width="2.2" stroke-linejoin="round"/><ellipse cx="6.6" cy="17.6" rx="2.8" ry="2.2" fill="#c9b2ff" stroke="#7a6a99" stroke-width="1.6"/><ellipse cx="16.6" cy="15.5" rx="2.8" ry="2.2" fill="#9fd2ff" stroke="#7a6a99" stroke-width="1.6"/><path class="slash" d="M4 4l16 16" stroke="#ff6b8b" stroke-width="2.6" stroke-linecap="round"/></svg></button>
    <div class="tally" aria-label="Stars"><svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z"/></svg><span id="starCount">0</span></div>
  </div>
  <div class="timer" id="timer" role="timer" aria-label="Time left"><div class="track"><div class="fill" id="timerFill"></div></div><span class="clock">⏱</span><span class="ttxt" id="timerTxt">1:00</span></div>
  <div id="boardWrap"><div id="board" aria-label="Number grid"></div></div>
  <div class="bottom">
    <div class="hearts" id="hearts" aria-label="Hearts"></div>
    <div class="bubble" id="bubble"><span class="chip" id="levelChip"></span><span class="msg" id="bubbleMsg" aria-live="polite"></span></div>
    <button id="munchBtn" aria-label="Munch (Space)">Munch!<span class="k">Space</span></button>
  </div>
  <div class="keys" id="keys">
    <span class="grp"><span class="arrows"><kbd data-k="ArrowUp" class="up">↑</kbd><kbd data-k="ArrowLeft">←</kbd><kbd data-k="ArrowDown">↓</kbd><kbd data-k="ArrowRight">→</kbd></span> move</span>
    <span class="grp"><kbd class="wide" data-k=" ">Space</kbd> munch</span>
    <span class="grp"><kbd data-k="r">R</kbd> hear it again</span>
    <span class="grp"><kbd data-k="m">M</kbd> music</span>
  </div>
  <div class="keys touch" id="touchHint">Tap a square to walk · tap your friend to munch</div>
</section>

<script src="../../js/core/voice-lines.js"></script>

<script src="../../js/core/coach.js"></script>

<script src="../../js/core/music.js"></script>

<script src="../../js/core/rewards.js"></script>
<script src="../../js/core/pace.js"></script>

<script src="../../js/core/storybook.js"></script>

<script src="munch.js"></script>
</body>
</html>
